<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Questions</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main class="box">
        <h1> My First Quiz Form</h1>
        <form class="box">
            <div class="quiz-item box">
                <label for="q1"> Q1. Where are you from? </label>
                <input type="text" id="q1" name="q1" placeholder="enter your hometown">
            </div>
            <div class="quiz-item box">
                <label for="q2"> Q2. What do you think about our products?
                </label>
                <textarea id="q2" name="q2" rows="4"></textarea>
            </div>
            <div class="quiz-item box">
                <label for="q3"> Q3. Favourite City</label>
                <select name="q3" id="q3">
                    <option value="zomba" selected disabled>Zomba</option>
                    <option value="blantyre">Blantyre</option>
                    <option value="lilongwe">Lilongwe</option>
                </select>
            </div>
            <div class="quiz-item box">
                <label for="number">Q4. On a scale of 1 - 5, how would you rate our services?
                </label>
                <code class="box">rating: 1 2 3 4 5 </code>
                <input type="number" name="q4" id="q4">
            </div>
            <button type="submit"> Submit your responses</button>
        </form>
    </main>
</body>

</html>
